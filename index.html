    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('tab-'+this.dataset.tab).classList.add('active');
        if(this.dataset.tab==='candidate-changes') loadCandidateChanges();
      });
    });
    let _changesLoaded=false, _allChanges=[];
    async function loadCandidateChanges(){
      if(_changesLoaded){renderChanges();return;}
      const el=document.getElementById('candidateChangeLog');
      el.innerHTML='<div class="empty-state">載入中…</div>';
      try{
        const q2=query(collection(db,'candidate_changes'),orderBy('date','desc'),limit(100));
        const snap=await getDocs(q2);
        _allChanges=[];
        snap.forEach(d=>{_allChanges.push({id:d.id,...d.data()});});
        _changesLoaded=true;renderChanges();
      }catch(e){el.innerHTML='<div class="empty-state">載入失敗：'+e.message+'</div>';}
    }
    document.getElementById('clearDateFilterBtn').addEventListener('click',()=>{document.getElementById('changeDateFilter').value='';renderChanges();});
    document.getElementById('changeDateFilter').addEventListener('change',renderChanges);
    function renderChanges(){
      const el=document.getElementById('candidateChangeLog');
      const f=document.getElementById('changeDateFilter').value;
      let recs=f?_allChanges.filter(r=>(r.date||'').startsWith(f)):_allChanges;
      if(!recs.length){el.innerHTML='<div class="empty-state">目前無紀錄</div>';return;}
      const g={};recs.forEach(r=>{const k=(r.date||'').slice(0,10)||'未知';if(!g[k])g[k]=[];g[k].push(r);});
      let out='';
      Object.keys(g).sort((a,b)=>b.localeCompare(a)).forEach(date=>{
        const added=g[date].filter(r=>r.type==='added'),removed=g[date].filter(r=>r.type==='removed');
        out+='<div class="change-date-group"><div class="change-date-label">📅 '+date+'</div>';
        if(added.length)out+='<div class="change-section"><h3>✅ 新增（'+added.length+'）</h3>'+added.map(r=>'<div class="change-card added"><span class="change-badge added">新增</span><b>'+r.candidateId+'</b>'+(r.age?' · '+r.age+'歲':'')+(r.country?' · '+r.country:'')+'</div>').join('')+'</div>';
        if(removed.length)out+='<div class="change-section"><h3>❌ 移除（'+removed.length+'）</h3>'+removed.map(r=>'<div class="change-card removed"><span class="change-badge removed">移除</span><b>'+r.candidateId+'</b>'+( r.age?' · '+r.age+'歲':'')+(r.country?' · '+r.country:'')+'</div>').join('')+'</div>';
        out+='</div>';
      });
      el.innerHTML=out;
    }
</script>

        while (size >= 1024 && unitIndex < units.length - 1) {
